#
# Run by hand (Actions > Release > Run workflow) on the release branch, after
# setting the new Version in rpm/parrotfish-keyboard.spec and adding its
# entry to CHANGELOG.md: runs the checks, builds the RPMs and creates the
# GitHub release v<Version> with them attached, for that commit. main is
# fast-forwarded to it only once this has worked (DEVELOPMENT.md, "Making a
# release"). The release text is the changelog entry, followed by GitHub's
# generated notes (contributors, full changelog link).
name: Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Create the release as a draft, to review before publishing
        type: boolean
        default: true

permissions:
  contents: write

env:
  # Sailfish SDK target the RPMs are built against; Qt 5.6.3 like 5.2.x
  SFOS_RELEASE: 5.1.0.11

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.spec.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # All of the history, to compare the commit with main
          fetch-depth: 0
      - id: spec
        run: |
          version=$(sed -n 's/^Version:[[:space:]]*//p' rpm/parrotfish-keyboard.spec)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *~*)
              echo "::error::$version is a test version; a release has no ~ suffix"
              exit 1
              ;;
          esac
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error::v$version already exists; raise Version in rpm/parrotfish-keyboard.spec"
            exit 1
          fi
          if ! ci/release-notes.sh "$version" > /dev/null; then
            echo "::error::CHANGELOG.md has no entry for $version"
            exit 1
          fi
          # main must be able to fast-forward to the released commit
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::main has commits that $GITHUB_REF_NAME lacks; merge main into it first"
            exit 1
          fi

  checks:
    needs: version
    uses: ./.github/workflows/checks.yml

  build:
    needs: [version, checks]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [aarch64, armv7hl]
    steps:
      - uses: actions/checkout@v7
      # The dictionaries of the checks' PC build: the RPM's build copies
      # them (same inputs, same files) instead of building them under
      # emulation.
      - uses: actions/download-artifact@v8
        with:
          name: dictionaries
          path: prebuilt
      - run: ci/build-rpm.sh ${{ matrix.arch }} "$SFOS_RELEASE"
      # Both builds make the same noarch language packages: only aarch64's
      # go to the release (two copies downloaded into one folder at once
      # overwrite each other: the 1.0.0 rehearsal got a truncated one).
      - if: matrix.arch != 'aarch64'
        run: rm -f out/*.noarch.rpm
      - uses: actions/upload-artifact@v7
        with:
          name: rpm-${{ matrix.arch }}
          path: out/*.rpm
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: rpm-*
          path: rpms
          merge-multiple: true
      # Every package whole (header and payload digests) before it's
      # attached.
      - name: Check the packages
        run: |
          sudo apt-get install -y --no-install-recommends rpm > /dev/null
          ls -l rpms
          rpm -K --nosignature rpms/*.rpm
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          DRAFT: ${{ inputs.draft && '--draft' || '' }}
        run: |
          gh release create "v$VERSION" rpms/*.rpm $DRAFT \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Parrotfish Keyboard $VERSION" \
            --notes "$(ci/release-notes.sh "$VERSION")" --generate-notes
