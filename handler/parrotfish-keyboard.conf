# Registers the Parrotfish handler for our own layout only (its
# languageCode; it also names it with handler= in layouts_parrotfish.conf).
# Jolla's layouts keep the device's handler (XT9 or Hunspell).
# settings= adds our section to Settings > Text input (as XT9's does).
[parrotfish-keyboard]
name=Parrotfish
languages=PARROTFISH
handler=ParrotfishHandler.qml
settings=/usr/share/parrotfish-keyboard/settings/ParrotfishSettings.qml
priority=150
