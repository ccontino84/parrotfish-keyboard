# The Parrotfish layout: the keys only (QWERTY or QWERTZ, chosen in our
# settings); the typing languages are chosen by the engine. It uses the
# Parrotfish handler directly. No commas in names: the conf parser reads
# them as lists. Jolla's settings sort layouts by name (locale-aware), so
# "Auto" puts it at the top of the list, above the Latin endonyms (user,
# 2026-10-09; the parentheses follow Jolla's "Lietuvių (ąžerty)").
[parrotfish.qml]
name=Auto (Parrotfish)
languageCode=PARROTFISH
handler=ParrotfishHandler.qml
settings=/usr/share/parrotfish-keyboard/settings/ParrotfishSettings.qml
