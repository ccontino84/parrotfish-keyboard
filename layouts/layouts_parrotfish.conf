# Universal Latin layouts: the keys only; the typing languages are chosen by
# the engine. They use the Parrotfish handler directly. No commas in names:
# the conf parser reads them as lists.
[parrotfish-qwerty.qml]
name=Latin QWERTY (Parrotfish)
languageCode=QWERTY
handler=ParrotfishHandler.qml

[parrotfish-qwertz.qml]
name=Latin QWERTZ (Parrotfish)
languageCode=QWERTZ
handler=ParrotfishHandler.qml

