# The Parrotfish layouts: one per key arrangement, any typing language on
# each (the engine picks it); Jolla's keyboard switches between the enabled
# ones (spacebar long press, swipe); they are switched on in Jolla's
# Keyboards page, as any other. They use the Parrotfish handler directly.
# No commas in names: the conf parser reads them as lists. Jolla's settings
# sort layouts by name (locale-aware), so "Auto" puts them at the top of the
# list, above the Latin endonyms (user, 2026-10-09; the parentheses follow
# Jolla's "Lietuvių (ąžerty)"). One settings page for all: Jolla loads each
# settings= path once.
[parrotfish.qml]
name=Auto (QWERTY)
languageCode=PARROTFISH
handler=ParrotfishHandler.qml
settings=/usr/share/parrotfish-keyboard/settings/ParrotfishSettings.qml

[parrotfish_qwertz.qml]
name=Auto (QWERTZ)
languageCode=PARROTFISH
handler=ParrotfishHandler.qml
settings=/usr/share/parrotfish-keyboard/settings/ParrotfishSettings.qml

[parrotfish_azerty.qml]
name=Auto (AZERTY)
languageCode=PARROTFISH
handler=ParrotfishHandler.qml
settings=/usr/share/parrotfish-keyboard/settings/ParrotfishSettings.qml

[parrotfish_nordic.qml]
name=Auto (QWERTY ÅÖÄ)
languageCode=PARROTFISH
handler=ParrotfishHandler.qml
settings=/usr/share/parrotfish-keyboard/settings/ParrotfishSettings.qml
